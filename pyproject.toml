[project]
name = "glitch-runner"
version = "2.0.0"
description = "A 2D platformer where reality keeps glitching."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pygame>=2.6.1",
]

[project.scripts]
glitch-runner = "glitch_runner.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
build = [
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glitch_runner"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
